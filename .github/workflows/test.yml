name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned Rust toolchain from the tested version matrix (see docs/toolchain-matrix.md).
  # Update this together with the matrix and rerun native/WASM/local-host validation.
  RUST_TOOLCHAIN: "1.84.0"

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release-guards:
    name: Contract Version and Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify CONTRACT_VERSION matches crate version and git version tag
        run: bash .github/scripts/check-contract-version.sh
      - name: Verify changelog for contract version changes
        if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-changelog.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features

      - name: Rustdoc (warning-failing)
        # Fail on broken intra-doc links and any other rustdoc warning so
        # source API documentation cannot silently drift. Runs offline against
        # the supported host/contract feature configuration.
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --all-features

  fuzzing-feature-check:
    name: Fuzzing Feature Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile optional fuzzing feature on host target
        run: cargo check -p will --features fuzzing --locked
      - name: Verify guard catches broken feature-only derive
        run: bash scripts/check-fuzzing-feature-guard.sh

  resource-costs:
    name: Resource Cost Docs Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify docs/RESOURCE_COSTS.md matches measured output
        # The script exits non-zero on drift and also fails when profiling is
        # disabled, so a skipped profile cannot be mistaken for a verified
        # matching measurement. Do not add continue-on-error or conditional
        # skipping here.
        run: bash scripts/check_resource_costs.sh

  build-wasm:
    name: Build & Verify WASM Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build contract & verify binary size
        run: bash scripts/check-wasm-size.sh